<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entre Apus TV | Medio Digital Comunitario de Chalhuanca y Aymaraes</title>
    <meta name="description" content="Medio de comunicación digital comunitario de Chalhuanca y Aymaraes, Apurímac." />
    <meta property="og:title" content="Entre Apus TV | Medio Digital Comunitario de Chalhuanca y Aymaraes" />
    <meta property="og:description" content="Medio de comunicación digital comunitario de Chalhuanca y Aymaraes, Apurímac." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Soporte dual de CSS para raíz ./index.css o carpeta ./assets/index.css -->
    <link rel="stylesheet" id="app-style-root" href="./index.css">
    <link rel="stylesheet" id="app-style-assets" href="./assets/index.css">
  </head>
  <body style="background-color: #040915; color: #f8fafc; margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;" class="bg-[#040915] text-slate-100 font-sans antialiased min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #040915; color: #f59e0b; font-family: system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #f59e0b; border-radius: 50%; animation: apus-spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 24px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff; letter-spacing: 0.05em; font-family: 'Cinzel', serif;">ENTRE APUS TV</h2>
        <p style="font-size: 14px; color: #cbd5e1; margin: 0 0 6px 0;">Cargando señal comunitaria de Chalhuanca y Aymaraes...</p>
        <p style="font-size: 12px; color: #64748b; margin: 0;">Medio de Comunicación Digital</p>
      </div>
    </div>
    <style>
      @keyframes apus-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- Punto de entrada para Vite dev server y compilación -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cargador resiliente para GitHub Pages y hosting estático -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          setTimeout(function() {
            if (!window.__ENTREAPUS_LOADED__) {
              console.log('[Entre Apus TV] Iniciando cargador estático resiliente...');
              var candidates = ['./index.js', './assets/index.js'];
              var i = 0;
              function tryScript() {
                if (i >= candidates.length || window.__ENTREAPUS_LOADED__) return;
                var scriptUrl = candidates[i++];
                var scriptEl = document.createElement('script');
                scriptEl.type = 'module';
                scriptEl.crossOrigin = 'anonymous';
                scriptEl.src = scriptUrl;
                scriptEl.onload = function() {
                  window.__ENTREAPUS_LOADED__ = true;
                  console.log('[Entre Apus TV] Módulo cargado exitosamente desde:', scriptUrl);
                };
                scriptEl.onerror = function() {
                  console.warn('[Entre Apus TV] Falló carga de:', scriptUrl, '- Probando siguiente alternativa...');
                  tryScript();
                };
                document.body.appendChild(scriptEl);
              }
              tryScript();
            }
          }, 200);
        }
      })();
    </script>
  </body>
</html>
